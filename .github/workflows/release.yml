name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate_tag
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate_tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify before packaging
        run: |
          go tool revive -config revive.toml ./...
          go vet ./...
          go vet -tags e2e ./...
          go test -count=1 ./...

      - name: Package KoiSide.app
        run: |
          go tool mygo build -platform darwin/arm64,darwin/amd64 -skip-dmg
          test -d build/darwin-arm64/KoiSide.app
          test -d build/darwin-amd64/KoiSide.app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare installer artwork and tools
        run: |
          python -m pip install -r scripts/dmg-requirements.txt
          swift scripts/dmg-background.swift build/dmg-background.png

      - name: Create DMG, ZIP, and checksums
        shell: bash
        run: |
          TAG="${{ needs.validate_tag.outputs.tag }}"
          mkdir -p dist

          for ARCH in arm64 amd64; do
            DMG_NAME="KoiSide-${TAG}-macos-${ARCH}.dmg"
            ZIP_NAME="KoiSide-${TAG}-macos-${ARCH}.zip"

            # Artwork and icon positions use the same 640 x 400 point canvas.
            # Notices are bundled in Contents/Resources before code signing.
            python -m dmgbuild -s scripts/dmg-settings.py \
              -D app="build/darwin-${ARCH}/KoiSide.app" \
              -D background=build/dmg-background.png \
              "KoiSide" "dist/${DMG_NAME}"

            # ZIP opens directly to the app, including its bundled notices.
            ditto -c -k --sequesterRsrc --keepParent "build/darwin-${ARCH}/KoiSide.app" "dist/${ZIP_NAME}"
          done

          # Checksums
          (cd dist && shasum -a 256 *.dmg *.zip > checksums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: koiside-release-files
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate_tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: koiside-release-files
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate_tag.outputs.tag }}
          name: KoiSide ${{ needs.validate_tag.outputs.tag }}
          prerelease: ${{ needs.validate_tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
