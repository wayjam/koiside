name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify before packaging
        run: |
          go tool revive -config revive.toml ./...
          go vet ./...
          go vet -tags e2e ./...
          go test -count=1 ./...

      - name: Package KoiSide.app
        run: |
          go tool mygo build -platform darwin/arm64 -skip-dmg
          test -d build/darwin-arm64/KoiSide.app

      - name: Create DMG, ZIP, and checksums
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          fi
          mkdir -p dist
          DMG_NAME="KoiSide-${TAG}-macos-arm64.dmg"
          ZIP_NAME="KoiSide-${TAG}-macos-arm64.zip"

          # Create DMG with /Applications symlink
          STAGE_DIR=$(mktemp -d)
          trap 'rm -rf "${STAGE_DIR}"' EXIT
          cp -R build/darwin-arm64/KoiSide.app "${STAGE_DIR}/"
          ln -s /Applications "${STAGE_DIR}/Applications"
          hdiutil create -volname "KoiSide" -srcfolder "${STAGE_DIR}" -ov -format UDZO "dist/${DMG_NAME}"
          rm -rf "${STAGE_DIR}"

          # Create ZIP
          ditto -c -k --sequesterRsrc --keepParent build/darwin-arm64/KoiSide.app "dist/${ZIP_NAME}"

          # Checksums
          (cd dist && shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > checksums.txt)

          # Detect prerelease (-alpha, -beta, -rc, etc.)
          if [[ "${TAG}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: KoiSide ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
