name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate_tag
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate_tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify before packaging
        run: |
          go tool revive -config revive.toml ./...
          go vet ./...
          go vet -tags e2e ./...
          go test -count=1 ./...

      - name: Package KoiSide.app
        run: |
          go tool mygo build -platform darwin/arm64 -skip-dmg
          test -d build/darwin-arm64/KoiSide.app

      - name: Create DMG, ZIP, and checksums
        shell: bash
        run: |
          TAG="${{ needs.validate_tag.outputs.tag }}"
          mkdir -p dist
          DMG_NAME="KoiSide-${TAG}-macos-arm64.dmg"
          ZIP_NAME="KoiSide-${TAG}-macos-arm64.zip"

          # Create DMG with /Applications symlink
          TEMP_DIR=$(mktemp -d)
          STAGE_DIR="${TEMP_DIR}/KoiSide-${TAG}"
          mkdir -p "${STAGE_DIR}"
          trap 'rm -rf "${TEMP_DIR}"' EXIT
          cp -R build/darwin-arm64/KoiSide.app "${STAGE_DIR}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "${STAGE_DIR}/"
          ln -s /Applications "${STAGE_DIR}/Applications"
          hdiutil create -volname "KoiSide" -srcfolder "${STAGE_DIR}" -ov -format UDZO "dist/${DMG_NAME}"
          rm "${STAGE_DIR}/Applications"

          # Create ZIP with the app and license notices
          ditto -c -k --sequesterRsrc --keepParent "${STAGE_DIR}" "dist/${ZIP_NAME}"

          # Checksums
          (cd dist && shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > checksums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: koiside-release-files
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate_tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: koiside-release-files
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate_tag.outputs.tag }}
          name: KoiSide ${{ needs.validate_tag.outputs.tag }}
          prerelease: ${{ needs.validate_tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
